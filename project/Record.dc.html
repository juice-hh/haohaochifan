<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5FC">
<meta name="apple-mobile-web-app-title" content="好好吃饭">
<link rel="manifest" href="./app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/app-180.png">
<link rel="stylesheet" href="./mobile.css">
<title>好好吃饭 拍一餐</title>
<script src="./support.js"></script>
<script src="./journal.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#6F6A78;text-decoration:none}a:hover{color:#2A2633}
</style>
</helmet>
<div class="screen" style="background: #F7F5FC; color: #2A2633; font-family: -apple-system, system-ui, 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="{{closeHref}}" aria-label="关闭" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-size: 17px; font-weight: 800">{{title}}</span>
    <span style="width: 44px"></span>
  </div>

  <sc-if value="{{missingRecord}}">
    <p role="alert" style="color: #6F6A78">这餐已找不到了，请返回当天详情。</p>
  </sc-if>
  <sc-if value="{{showForm}}">
  <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 10px 16px; font-size: 14px; font-weight: 800">
      记录日期
      <input type="date" value="{{date}}" max="{{today}}" onChange="{{setDate}}" style="min-height: 32px; max-width: 170px; border: none; background: #F7F5FC; border-radius: 10px; padding: 0 8px; color: #2A2633; font: inherit; font-size: 16px">
    </label>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: #FFFFFF; border-radius: 999px; padding: 5px; box-shadow: 0 10px 30px rgba(90, 70, 160, 0.06)">
    <sc-for list="{{meals}}" as="m" hint-placeholder-count="4">
      <button type="button" aria-pressed="{{m.selected}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
    </sc-for>
  </div>

  <div class="record-mode" role="group" aria-label="记录方式">
    <button type="button" aria-pressed="{{autoRecognize}}" onClick="{{useAI}}">AI 辅助</button>
    <button type="button" aria-pressed="{{manualMode}}" onClick="{{useManual}}">手动记录</button>
  </div>
  <section class="meal-photo-card" aria-label="餐食照片">
    <div class="meal-photo-actions">
      <button type="button" class="plan-action" onClick="{{openCamera}}" aria-disabled="{{cameraOpen}}">打开相机</button>
      <label class="plan-action meal-file">
        从相册选
        <input type="file" accept="image/*" onChange="{{choosePhoto}}" aria-label="从相册选">
      </label>
    </div>
    <sc-if value="{{cameraFailed}}">
      <label class="plan-action meal-file meal-native-camera">
        用系统相机拍
        <input type="file" accept="image/*" capture="environment" onChange="{{choosePhoto}}" aria-label="用系统相机拍">
      </label>
    </sc-if>
    <sc-if value="{{cameraOpen}}">
      <video id="meal-camera" class="meal-camera" autoplay muted playsinline onCanPlay="{{cameraReady}}"></video>
      <div class="meal-photo-actions">
        <button type="button" class="plan-action" onClick="{{capturePhoto}}" aria-disabled="{{cameraWaiting}}">拍照</button>
        <button type="button" class="plan-action" onClick="{{closeCamera}}">关闭相机</button>
      </div>
    </sc-if>
    <sc-if value="{{showPhoto}}">
      <img class="meal-photo-preview" src="{{photo}}" alt="这一餐的照片" draggable="false">
      <button type="button" class="meal-remove-photo" onClick="{{removePhoto}}">移除照片</button>
    </sc-if>
    <p class="meal-photo-hint" role="status">{{photoHint}}</p>
    <p class="meal-photo-hint">{{recognitionHint}}</p>
    <p class="meal-photo-hint" role="status">{{recognitionNote}}</p>
    <sc-if value="{{canRecognize}}"><button type="button" class="plan-action" onClick="{{recognize}}">{{recognizeLabel}}</button></sc-if>
    <sc-if value="{{recognizing}}"><button type="button" class="plan-action" onClick="{{cancelRecognition}}">停止识别，手动填写</button></sc-if>
  </section>

  <div style="background: #FFFFFF; border-radius: 32px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(90, 70, 160, 0.06); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 16px; font-weight: 900">确认这一餐</span>
      <span style="font-size: 12px; font-weight: 600; color: #6F6A78">营养数据选填</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; background: #F7F5FC; border-radius: 18px; padding: 0 16px; height: 46px">
      <span style="font-size: 13px; font-weight: 700; color: #6F6A78; flex-shrink: 0">吃的是</span>
      <input value="{{name}}" onInput="{{setName}}" maxlength="60" placeholder="给这一餐起个名字" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 16px; font-weight: 800; color: #2A2633; font-family: inherit; outline: none">
    </label>
    <div class="nutrition-fields">
      <sc-for list="{{rows}}" as="r">
        <label class="goal-field">
          <span>{{r.label}}</span>
          <input type="number" inputmode="decimal" min="0" max="10000" step="0.1" value="{{r.value}}" onInput="{{r.change}}">
        </label>
      </sc-for>
    </div>
    <div style="position: relative; padding: 4px 0 0">
      <div style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px">
        <div style="{{bar1}}"></div><div style="{{bar2}}"></div><div style="{{bar3}}"></div>
      </div>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <div style="display: flex; align-items: baseline; gap: 4px">
        <span style="font-size: 13px; font-weight: 700; color: #6F6A78">这一餐约</span>
        <span style="font-size: 24px; font-weight: 900; color: #7A66E0">{{kcal}}</span>
        <span style="font-size: 13px; font-weight: 800">kcal</span>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #6F6A78">{{ratioText}}</span>
    </div>
  </div>

  <div class="record-actions">
  <sc-if value="{{error}}">
    <p role="alert" style="margin: 0; font-size: 13px; color: #C9372C">{{error}}</p>
  </sc-if>
  <button type="button" class="record-save" onClick="{{save}}" aria-disabled="{{busy}}" style="height: 54px; flex-shrink: 0; border: none; font-family: inherit; cursor: pointer; border-radius: 999px; background: #7A66E0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 800; box-shadow: 0 10px 22px rgba(122, 102, 224, 0.3)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    {{saveLabel}}
  </button>
  <sc-if value="{{editing}}">
    <button type="button" onClick="{{deleteMeal}}" aria-disabled="{{busy}}" style="min-height: 40px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 800; color: #B63843; cursor: pointer">删除这餐</button>
  </sc-if>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
function makePhoto(source, width, height) {
  if (!width || !height) throw new Error("照片还没准备好。");
  const scale = Math.min(1, 640 / Math.max(width, height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(width * scale));
  canvas.height = Math.max(1, Math.round(height * scale));
  const context = canvas.getContext("2d");
  context.fillStyle = "#FFFFFF";
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.drawImage(source, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.72);
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const selected = Journal.selected(Journal.today);
    const editId = Journal.params.get("edit");
    this.original = editId ? Journal.getMeal(editId) : null;
    this.missingRecord = Boolean(editId && !this.original);
    this.date = this.original?.date ?? (selected > Journal.today ? Journal.today : selected);
    this.returnToDay = Boolean(editId) || Journal.params.get("from") === "day";
    this.via = Journal.params.get("via") === "album" ? "album" : "week";
    this.photoRequest = 0;
    this.cameraRequest = 0;
    this.recognitionRequest = 0;
    this.recognitionController = null;
    this.stream = null;
    window.addEventListener("pagehide", () => { this.releaseCamera(); this.recognitionController?.abort(); });
    this.saving = false;
    let autoRecognize = true;
    try { autoRecognize = localStorage.getItem("hhcf-record-mode") !== "manual"; } catch {}
    const [carb, pro, fat] = this.original?.grams ?? [0, 0, 0];
    this.state = {
      autoRecognize, meal: this.original?.kind ?? "dinner", carb, pro, fat, date: this.date,
      name: this.original?.name ?? (Journal.params.get("name") ?? "").slice(0, 60),
      photo: null, busy: false, error: "",
      camera: "closed", cameraError: "", recognizing: false, recognitionNote: "",
      portion: this.original?.portion ?? "",
      calories: this.original?.kcal ?? ""

    };
  }

  releaseCamera() {
    this.cameraRequest++;
    this.stream?.getTracks().forEach((track) => track.stop());
    this.stream = null;
  }

  closeCamera() {
    this.releaseCamera();
    this.setState({ camera: "closed" });
  }

  async openCamera() {
    if (this.state.camera !== "closed" || this.saving) return;
    this.cancelRecognition();
    const request = ++this.cameraRequest;
    this.setState({ camera: "loading", cameraError: "" });
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      if (request !== this.cameraRequest) {
        stream.getTracks().forEach((track) => track.stop());
        return;
      }
      this.stream = stream;
      const video = document.getElementById("meal-camera");
      video.muted = true;
      video.srcObject = stream;
      await video.play();
    } catch (error) {
      if (request !== this.cameraRequest) return;
      this.releaseCamera();
      this.setState({
        camera: "closed",
        cameraError: error.name === "NotAllowedError"
          ? "相机未获授权。可以在浏览器里允许相机，或试试系统相机和相册。"
          : "当前浏览器无法打开相机，可以试试系统相机或从相册选。"
      });
    }
  }

  capturePhoto() {
    if (this.state.camera !== "ready") return;
    try {
      const video = document.getElementById("meal-camera");
      const photo = makePhoto(video, video.videoWidth, video.videoHeight);
      this.photoRequest++;
      this.releaseCamera();
      this.setState({ camera: "closed", photo, busy: false, error: "" });
      this.recognizeIfEnabled(photo);
    } catch {
      this.setState({ cameraError: "没能拍下照片，请重试或从相册选。" });
    }
  }

  async choosePhoto(event) {
    const file = event.target.files[0];
    if (!file || this.saving) return;
    this.cancelRecognition();
    const request = ++this.photoRequest;
    this.releaseCamera();
    this.setState({ camera: "closed", cameraError: "", busy: true, error: "" });
    event.target.value = "";
    const url = URL.createObjectURL(file);
    try {
      const image = new Image();
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = reject;
        image.src = url;
      });
      const photo = makePhoto(image, image.naturalWidth, image.naturalHeight);
      if (request === this.photoRequest) {
        this.setState({ photo, busy: false });
        this.recognizeIfEnabled(photo);
      }
    } catch {
      if (request === this.photoRequest) {
        this.setState({ busy: false, error: "这张照片无法读取，请换一张 JPG 或 PNG。" });
      }
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  setRecordingMode(autoRecognize) {
    if (this.saving || this.state.autoRecognize === autoRecognize) return;
    this.cancelRecognition();
    try { localStorage.setItem("hhcf-record-mode", autoRecognize ? "ai" : "manual"); } catch {}
    this.setState({ autoRecognize, recognitionNote: autoRecognize
      ? "拍新照片后会自动识别；已有照片可点击下方识别。"
      : "照片会保存在这台设备上，可以直接记下这一餐。" });
  }

  recognizeIfEnabled(photo) {
    if (this.state.autoRecognize) this.recognize(photo);
    else this.setState({ recognitionNote: "照片已就绪，可以直接保存，也可以补充餐名和营养。" });
  }

  cancelRecognition() {
    this.recognitionRequest++;
    this.recognitionController?.abort();
    this.setState({ recognizing: false });
  }

  async recognize(photo = this.state.photo ?? Journal.photoFor(this.original)) {
    if (!photo || this.saving) return;
    this.cancelRecognition();
    const request = this.recognitionRequest;
    const controller = new AbortController();
    this.recognitionController = controller;
    this.setState({ recognizing: true, recognitionNote: "正在识别食物和估算份量…" });
    const timer = setTimeout(() => controller.abort(), 55000);
    try {
      if (photo.startsWith("blob:")) {
        const blob = await (await fetch(photo)).blob();
        photo = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }
      const response = await fetch("/api/recognize", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ photo }), signal: controller.signal
      });
      const result = await response.json();
      if (request !== this.recognitionRequest) return;
      if (!response.ok) throw new Error(result.error || "识别失败，请重试。");
      if (!result.foodVisible) {
        this.setState({ recognitionNote: "没看清可识别的食物，请换一张照片或手动填写。" });
        return;
      }
      this.setState({
        name: result.name, portion: result.portion, calories: result.kcal,
        carb: result.carb, pro: result.pro, fat: result.fat,
        recognitionNote: "AI 估算，请核对后保存。" + result.notes
      });
    } catch (error) {
      if (request === this.recognitionRequest) {
        this.setState({ recognitionNote: error.name === "AbortError"
          ? "识别超时，可以重试或手动填写。"
          : error.message.startsWith("Unexpected") ? "识别服务暂时不可用，请手动填写或稍后重试。" : error.message });
      }
    } finally {
      clearTimeout(timer);
      if (request === this.recognitionRequest) this.setState({ recognizing: false });
    }
  }

  async save() {
    if (this.state.busy || this.state.recognizing || this.state.camera !== "closed" || this.saving) return;
    const { meal, carb, pro, fat, photo, date } = this.state;
    const hasPhoto = photo === null ? Boolean(this.original?.photoKey || this.original?.photo) : Boolean(photo);
    const name = this.state.name.trim() || (hasPhoto ? Journal.kinds[meal] + "照片" : "");
    if (!name) {
      this.setState({ error: "拍一张照片，或写下这餐吃了什么。" });
      return;
    }
    const numeric = ["carb", "pro", "fat", "portion", "calories"];
    if (!numeric.every((key) => this.state[key] === "" ||
        Number.isFinite(Number(this.state[key])) && Number(this.state[key]) >= 0 && Number(this.state[key]) <= 10000)) {
      this.setState({ error: "请填写 0 到 10000 之间的有效数值。" });
      return;
    }
    this.saving = true;
    this.setState({ error: "" });
    try {
      await Journal.saveMeal(date, { name, kind: meal, grams: [carb, pro, fat].map(Number),
        portion: this.state.portion === "" ? null : Number(this.state.portion),
        kcal: this.state.calories === "" ? null : Number(this.state.calories) }, this.original, photo);
    } catch (error) {
      this.saving = false;
      this.setState({
        error: error instanceof DOMException ? "这餐没能存到浏览器，请确认还有可用空间后再试。" : error.message
      });
      return;
    }
    location.replace(this.returnToDay
      ? Journal.link("Day", date, { from: this.via, status: this.original ? "updated" : "saved" })
      : Journal.link("Main", date, { saved: "1" }));
  }

  deleteMeal() {
    if (!this.original || this.state.busy || this.state.recognizing || this.state.camera !== "closed" || this.saving) return;
    this.saving = true;
    try {
      const undo = Journal.deleteMeal(this.original);
      location.replace(Journal.link("Day", this.original.date, { from: this.via, undo }));
    } catch (error) {
      this.saving = false;
      this.setState({ error: error instanceof DOMException ? "暂时没能删除这餐，请重试。" : error.message });
    }
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var meals = [
      { id: 'breakfast', label: '早餐' },
      { id: 'lunch', label: '午餐' },
      { id: 'dinner', label: '晚餐' },
      { id: 'snack', label: '加餐' }
    ].map(function (m) {
      var on = s.meal === m.id;
      return {
        label: m.label,
        selected: on,
        pick: function () { self.setState({ meal: m.id }); },
        style: 'height: 40px; border: none; border-radius: 999px; font-size: 14px; font-family: inherit; font-weight: 800; background: ' + (on ? '#7A66E0' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#6F6A78')
      };
    });
    const rows = [
      { key: "portion", label: "总份量（克）" },
      { key: "calories", label: "热量（kcal）" },
      { key: "carb", label: "碳水（克）" },
      { key: "pro", label: "蛋白质（克）" },
      { key: "fat", label: "脂肪（克）" }
    ].map(({ key, label }) => ({
      label, value: s[key],
      change: (event) => {
        const value = event.target.value;
        this.cancelRecognition();
        this.setState({ [key]: value, recognitionNote: "按你的修改保存。" });
      }
    }));
    const estimate = Journal.estimate([s.carb, s.pro, s.fat].map(Number));
    const [carb, pro, fat] = estimate.percentages;
    const selectedDate = Journal.isDate(s.date) ? s.date : this.date;
    const dateLabel = Journal.shortDate(selectedDate);
    const cameraOpen = s.camera !== "closed";
    const photo = s.photo ?? Journal.photoFor(this.original);
    return {
      meals, rows, name: s.name, photo, busy: s.busy || s.recognizing || cameraOpen || this.saving, error: s.error,
      title: this.original ? "编辑这一餐" : selectedDate === Journal.today ? "拍一餐" : "补记 " + dateLabel,
      editing: Boolean(this.original),
      missingRecord: this.missingRecord,
      showForm: !this.missingRecord,
      date: s.date,
      today: Journal.today,
      setDate: (event) => this.setState({ date: event.target.value, error: "" }),
      closeHref: this.returnToDay
        ? Journal.link("Day", this.date, { from: this.via })
        : Journal.link("Main", this.date),
      autoRecognize: s.autoRecognize,
      manualMode: !s.autoRecognize,
      useAI: () => this.setRecordingMode(true),
      useManual: () => this.setRecordingMode(false),
      recognitionHint: s.autoRecognize
        ? "拍照或选图后会发送给 OpenAI 估算食物和营养，结果可修改。"
        : "只保存照片和你填写的内容；点击识别才会发送给 OpenAI。",
      recognizeLabel: s.autoRecognize ? "重新识别照片" : "用 AI 识别这张照片",
      recognizing: s.recognizing,
      recognitionNote: s.recognitionNote,
      canRecognize: Boolean(photo) && !s.recognizing && !s.busy && !cameraOpen,
      recognize: () => this.recognize(),
      cancelRecognition: () => { this.cancelRecognition(); this.setState({ recognitionNote: "可以手动填写后保存。" }); },
      cameraOpen,
      cameraWaiting: s.camera !== "ready",
      cameraFailed: Boolean(s.cameraError) && !cameraOpen,
      showPhoto: Boolean(photo) && !cameraOpen,
      photoHint: s.cameraError || (s.camera === "loading" ? "正在打开相机…" : s.busy
        ? "正在读取照片…" : cameraOpen ? "" : photo ? "照片已就绪，可填写餐名后保存" : "也可以只写餐名，不拍照"),
      openCamera: () => this.openCamera(),
      closeCamera: () => this.closeCamera(),
      cameraReady: () => {
        if (this.stream && this.state.camera === "loading") this.setState({ camera: "ready" });
      },
      capturePhoto: () => this.capturePhoto(),
      choosePhoto: (event) => this.choosePhoto(event),
      setName: (event) => {
        const name = event.target.value;
        const wasRecognizing = this.state.recognizing;
        this.cancelRecognition();
        this.setState({ name, error: "", ...(wasRecognizing ? { recognitionNote: "已停止识别，按你的填写保存。" } : {}) });
      },
      removePhoto: () => {
        this.cancelRecognition();
        this.photoRequest++;
        this.setState({ photo: "", busy: false, error: "", recognitionNote: "" });
      },
      save: () => this.save(),
      deleteMeal: () => this.deleteMeal(),
      saveLabel: this.saving ? "正在保存…" : s.busy ? "正在读取照片…" : cameraOpen ? "请先拍照或关闭相机" : s.recognizing ? "正在识别…" : this.original ? "确认并保存修改" : "确认并记到" + dateLabel,
      bar1: "width: " + carb + "%; background: #F6CF5C",
      bar2: "width: " + pro + "%; background: #A996F2",
      bar3: "width: " + fat + "%; background: #8FCFA6",
      kcal: s.calories !== "" ? s.calories : estimate.kcal ? String(estimate.kcal) : "—",
      ratioText: estimate.kcal ? [carb, pro, fat].join(" : ") : "暂无营养估算"
    };
  }
}
</script>
</body>
</html>
