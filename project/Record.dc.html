<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="./mobile.css">
<title>好好吃饭 拍一餐</title>
<script src="./support.js"></script>
<script src="./journal.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#6F6A78;text-decoration:none}a:hover{color:#2A2633}
</style>
</helmet>
<div class="screen" style="background: #F7F5FC; color: #2A2633; font-family: -apple-system, system-ui, 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="{{closeHref}}" aria-label="关闭" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-size: 17px; font-weight: 800">{{title}}</span>
    <span style="width: 44px"></span>
  </div>

  <sc-if value="{{missingRecord}}">
    <p role="alert" style="color: #6F6A78">这餐已找不到了，请返回当天详情。</p>
  </sc-if>
  <sc-if value="{{showForm}}">
  <sc-if value="{{editing}}">
    <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 10px 16px; font-size: 14px; font-weight: 800">
      记录日期
      <input type="date" value="{{date}}" max="{{today}}" onChange="{{setDate}}" style="min-height: 32px; max-width: 170px; border: none; background: #F7F5FC; border-radius: 10px; padding: 0 8px; color: #2A2633; font: inherit; font-size: 16px">
    </label>
  </sc-if>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: #FFFFFF; border-radius: 999px; padding: 5px; box-shadow: 0 10px 30px rgba(90, 70, 160, 0.06)">
    <sc-for list="{{meals}}" as="m" hint-placeholder-count="4">
      <button type="button" aria-pressed="{{m.selected}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
    </sc-for>
  </div>

  <div style="position: relative; min-height: 230px; background: #FFFFFF; border-radius: 32px; box-shadow: 0 10px 30px rgba(90, 70, 160, 0.06); overflow: hidden">
    <label class="photo-picker" style="position: absolute; left: 18px; top: 18px; z-index: 1; cursor: pointer; font-size: 13px; font-weight: 800; color: #5B48B8">
      {{choosePhotoLabel}}
      <input type="file" accept="image/*" onChange="{{choosePhoto}}" aria-label="选食物照片" style="position: absolute; width: 1px; height: 1px; opacity: 0">
    </label>
    <sc-if value="{{hasPhoto}}">
      <img src="{{photo}}" alt="这一餐的照片" draggable="false" style="position: absolute; left: 50%; top: 45px; width: 180px; height: 146px; transform: translateX(-50%) rotate(4deg); object-fit: cover; border: 5px solid #FFFFFF; box-sizing: border-box; border-radius: 28px; box-shadow: 0 12px 26px rgba(90, 70, 160, 0.18)">
    </sc-if>
    <sc-if value="{{noPhoto}}">
      <div style="position: absolute; left: 50%; top: 51px; width: 148px; height: 132px; transform: translateX(-50%) rotate(6deg); box-sizing: border-box; padding: 7px; background: #FFFFFF; border-radius: 44px 44px 66px 66px; box-shadow: 0 12px 26px rgba(90, 70, 160, 0.18)">
        <div style="width: 100%; height: 100%; border-radius: 40px 40px 62px 62px; background: #FFEADB; color: #9A4B0F; display: flex; align-items: center; justify-content: center; text-align: center; overflow-wrap: anywhere; font-size: 15px; font-weight: 800">{{stickerName}}</div>
      </div>
    </sc-if>
    <sc-if value="{{showPhotoAction}}">
      <button type="button" onClick="{{photoAction}}" style="position: absolute; right: 18px; top: 18px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 800; color: #5B48B8; cursor: pointer">{{photoActionLabel}}</button>
    </sc-if>
    <span style="position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; font-weight: 600; color: #6F6A78">{{photoHint}}</span>
  </div>

  <div style="background: #FFFFFF; border-radius: 32px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(90, 70, 160, 0.06); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 16px; font-weight: 900">确认这一餐</span>
      <span style="font-size: 12px; font-weight: 600; color: #6F6A78">营养选填，可拖滑杆估算</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; background: #F7F5FC; border-radius: 18px; padding: 0 16px; height: 46px">
      <span style="font-size: 13px; font-weight: 700; color: #6F6A78; flex-shrink: 0">吃的是</span>
      <input value="{{name}}" onInput="{{setName}}" maxlength="60" placeholder="给这一餐起个名字" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 16px; font-weight: 800; color: #2A2633; font-family: inherit; outline: none">
    </label>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <label style="display: flex; align-items: center; gap: 10px; height: 34px">
        <span style="{{r.dot}}"></span>
        <span style="font-size: 14px; font-weight: 700; width: 46px">{{r.label}}</span>
        <input type="range" min="0" max="150" step="1" value="{{r.value}}" onChange="{{r.change}}" style="{{r.slider}}">
        <span style="font-size: 14px; font-weight: 900; width: 44px; text-align: right">{{r.grams}}</span>
      </label>
    </sc-for>
    <div style="position: relative; padding: 4px 0 0">
      <div style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px">
        <div style="{{bar1}}"></div><div style="{{bar2}}"></div><div style="{{bar3}}"></div>
      </div>
      <div style="position: absolute; left: 40%; top: 0; width: 3px; height: 18px; background: #2A2633; border-radius: 2px"></div>
      <div style="position: absolute; left: 70%; top: 0; width: 3px; height: 18px; background: #2A2633; border-radius: 2px"></div>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <div style="display: flex; align-items: baseline; gap: 4px">
        <span style="font-size: 13px; font-weight: 700; color: #6F6A78">这一餐约</span>
        <span style="font-size: 24px; font-weight: 900; color: #7A66E0">{{kcal}}</span>
        <span style="font-size: 13px; font-weight: 800">kcal</span>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #6F6A78">{{ratioText}}</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <sc-if value="{{error}}">
    <p role="alert" style="margin: 0; font-size: 13px; color: #C9372C">{{error}}</p>
  </sc-if>
  <button type="button" onClick="{{save}}" aria-disabled="{{busy}}" style="height: 54px; flex-shrink: 0; border: none; font-family: inherit; cursor: pointer; border-radius: 999px; background: #7A66E0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 800; box-shadow: 0 10px 22px rgba(122, 102, 224, 0.3)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    {{saveLabel}}
  </button>
  <sc-if value="{{editing}}">
    <button type="button" onClick="{{deleteMeal}}" aria-disabled="{{busy}}" style="min-height: 40px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 800; color: #B63843; cursor: pointer">删除这餐</button>
  </sc-if>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const selected = Journal.selected(Journal.today);
    const editId = Journal.params.get("edit");
    this.original = editId ? Journal.getMeal(editId) : null;
    this.missingRecord = Boolean(editId && !this.original);
    this.date = this.original?.date ?? (selected > Journal.today ? Journal.today : selected);
    this.returnToDay = Boolean(editId) || Journal.params.get("from") === "day";
    this.via = Journal.params.get("via") === "album" ? "album" : "week";
    this.photoRequest = 0;
    this.saving = false;
    const [carb, pro, fat] = this.original?.grams ?? [0, 0, 0];
    this.state = {
      meal: this.original?.kind ?? "dinner", carb, pro, fat, date: this.date,
      name: this.original?.name ?? (Journal.params.get("name") ?? "").slice(0, 60),
      photo: this.original?.photo ?? "", busy: false, error: ""
    };
  }

  async choosePhoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    const request = ++this.photoRequest;
    this.setState({ busy: true, error: "" });
    event.target.value = "";
    try {
      const bitmap = await createImageBitmap(file);
      let photo;
      try {
        const scale = Math.min(1, 640 / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        const context = canvas.getContext("2d");
        context.fillStyle = "#FFFFFF";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        photo = canvas.toDataURL("image/jpeg", 0.8);
      } finally {
        bitmap.close();
      }
      if (request === this.photoRequest) this.setState({ photo, busy: false });
    } catch {
      if (request === this.photoRequest) {
        this.setState({ busy: false, error: "这张照片读不了，请换一张 JPG 或 PNG。" });
      }
    }
  }

  save() {
    if (this.state.busy || this.saving) return;
    const { meal, carb, pro, fat, photo, date } = this.state;
    const name = this.state.name.trim();
    if (!name) {
      this.setState({ error: "先写下这餐吃了什么。" });
      return;
    }
    this.saving = true;
    try {
      Journal.saveMeal(date, { name, kind: meal, grams: [carb, pro, fat], photo }, this.original);
    } catch (error) {
      this.saving = false;
      this.setState({
        error: error instanceof DOMException ? "这餐没能存到浏览器，请确认还有可用空间后再试。" : error.message
      });
      return;
    }
    location.replace(this.original
      ? Journal.link("Day", date, { from: this.via, status: "updated" })
      : Journal.link("Main", date, { saved: "1" }));
  }

  deleteMeal() {
    if (!this.original || this.state.busy || this.saving) return;
    this.saving = true;
    try {
      const undo = Journal.deleteMeal(this.original);
      location.replace(Journal.link("Day", this.original.date, { from: this.via, undo }));
    } catch (error) {
      this.saving = false;
      this.setState({ error: error instanceof DOMException ? "暂时没能删除这餐，请重试。" : error.message });
    }
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var meals = [
      { id: 'breakfast', label: '早餐' },
      { id: 'lunch', label: '午餐' },
      { id: 'dinner', label: '晚餐' },
      { id: 'snack', label: '加餐' }
    ].map(function (m) {
      var on = s.meal === m.id;
      return {
        label: m.label,
        selected: on,
        pick: function () { self.setState({ meal: m.id }); },
        style: 'height: 40px; border: none; border-radius: 999px; font-size: 14px; font-family: inherit; font-weight: 800; background: ' + (on ? '#7A66E0' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#6F6A78')
      };
    });
    var defs = [
      { key: 'carb', label: '碳水', color: '#F6CF5C' },
      { key: 'pro', label: '蛋白质', color: '#A996F2' },
      { key: 'fat', label: '脂肪', color: '#8FCFA6' }
    ];
    var rows = defs.map(function (d) {
      return {
        label: d.label,
        value: s[d.key],
        grams: s[d.key] + ' g',
        dot: 'width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: ' + d.color,
        slider: 'flex-grow: 1; min-width: 0; accent-color: ' + d.color,
        change: function (e) { var o = {}; o[d.key] = Number(e.target.value); self.setState(o); }
      };
    });
    const estimate = Journal.estimate([s.carb, s.pro, s.fat]);
    const [carb, pro, fat] = estimate.percentages;
    const dateLabel = Journal.shortDate(this.date);
    return {
      meals, rows, name: s.name, photo: s.photo, busy: s.busy, error: s.error,
      title: this.original ? "编辑这一餐" : this.date === Journal.today ? "拍一餐" : "补记 " + dateLabel,
      editing: Boolean(this.original),
      missingRecord: this.missingRecord,
      showForm: !this.missingRecord,
      date: s.date,
      today: Journal.today,
      setDate: (event) => this.setState({ date: event.target.value, error: "" }),
      closeHref: this.returnToDay
        ? Journal.link("Day", this.date, { from: this.via })
        : Journal.link("Main", this.date),
      hasPhoto: Boolean(s.photo),
      noPhoto: !s.photo,
      stickerName: s.name.trim() || "这一餐",
      photoHint: s.busy ? "正在读取照片…" : "照片选填，也可以只写名字",
      choosePhotoLabel: s.photo ? "换照片" : "选照片",
      showPhotoAction: Boolean(s.photo) || !this.original,
      photoActionLabel: s.photo ? "移除照片" : "试用示例",
      choosePhoto: (event) => this.choosePhoto(event),
      setName: (event) => this.setState({ name: event.target.value, error: "" }),
      photoAction: () => {
        if (s.photo) {
          this.photoRequest++;
          this.setState({ photo: "", busy: false, error: "" });
        } else {
          this.setState({ name: "番茄牛腩饭", carb: 68, pro: 32, fat: 18, error: "" });
        }
      },
      save: () => this.save(),
      deleteMeal: () => this.deleteMeal(),
      saveLabel: this.original ? "保存修改" : "记到" + dateLabel,
      bar1: "width: " + carb + "%; background: #F6CF5C",
      bar2: "width: " + pro + "%; background: #A996F2",
      bar3: "width: " + fat + "%; background: #8FCFA6",
      kcal: estimate.kcal ? String(estimate.kcal) : "—",
      ratioText: estimate.kcal ? [carb, pro, fat].join(" : ") : "暂无营养估算"
    };
  }
}
</script>
</body>
</html>
