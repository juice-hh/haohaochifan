<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5FC">
<meta name="apple-mobile-web-app-title" content="好好吃饭">
<link rel="manifest" href="./app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/app-180.png">
<link rel="stylesheet" href="./mobile.css?v=20261112-2">
<title>好好吃饭 我的目标</title>
<script src="./support.js?v=20261112-2"></script>
<script src="./journal.js?v=20261112-2"></script>
<script src="./navigation.js?v=20261112-2"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#6F6A78;text-decoration:none}a:hover{color:#2A2633}
</style>
</helmet>
<div class="screen screen--tabs" style="background: #F7F5FC; color: #2A2633; font-family: -apple-system, system-ui, 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; font-size: 15px; font-weight: 700; padding-right: 8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      本周
    </a>
  </div>

  <div style="display: flex; align-items: center; gap: 14px">
    <h1 style="margin: 0; font-size: 44px; font-weight: 900; line-height: 1.1">我的目标</h1>
    <div style="position: relative; background: #ECE8FB; color: #5B48B8; font-size: 14px; font-weight: 700; padding: 10px 14px; border-radius: 18px">
      <span style="position: absolute; left: -5px; top: 50%; width: 12px; height: 12px; margin-top: -6px; background: #ECE8FB; border-radius: 2px; transform: rotate(45deg)"></span>
      <span style="position: relative">吃好了才瘦得住</span>
    </div>
  </div>

  <section class="goal-card">
    <h2>最近一次体重</h2>
    <sc-if value="{{hasWeight}}">
      <p class="goal-current">{{currentWeight}} <small>kg</small></p>
      <span class="goal-note">{{weightDate}}</span>
    </sc-if>
    <sc-if value="{{noWeight}}">
      <p class="goal-note">还没有体重记录。你也可以只设生活习惯目标。</p>
      <a class="plan-action" href="{{weighHref}}">记一笔体重</a>
    </sc-if>
    <sc-if value="{{savedTarget}}"><p class="goal-note">你的目标体重 {{savedTarget}} kg</p></sc-if>
  </section>

  <form class="goal-card" onSubmit="{{save}}">
    <h2>设个自己的目标</h2>
    <label class="goal-field">
      <span>想养成的习惯</span>
      <input type="text" maxlength="80" placeholder="比如每周给自己做三顿饭" value="{{habit}}" onInput="{{setHabit}}">
    </label>
    <label class="goal-field">
      <span>目标体重（kg，选填）</span>
      <input type="text" inputmode="decimal" maxlength="7" placeholder="填写你自己的目标" value="{{target}}" onInput="{{setTarget}}">
    </label>
    <button type="submit" class="plan-action goal-save">保存目标</button>
    <p class="goal-note" role="status">{{message}}</p>
  </form>
  <journal-nav page="Goal" date="{{navDate}}"></journal-nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.latest = Journal.latestWeight();
    this.goal = Journal.readGoal();
    this.state = {
      habit: this.goal.habit,
      target: this.goal.weight === null ? "" : (this.goal.weight / 10).toFixed(1),
      message: ""
    };
  }

  save(event) {
    event.preventDefault();
    const target = this.state.target.trim();
    const weight = target ? Journal.parseWeight(target) : null;
    if (target && weight === null) {
      this.setState({ message: "请输入 0.1 到 500 公斤之间的体重。" });
      return;
    }
    const goal = { habit: this.state.habit.trim(), weight };
    try {
      Journal.saveGoal(goal);
      this.goal = goal;
      this.setState({
        habit: goal.habit,
        target: weight === null ? "" : (weight / 10).toFixed(1),
        message: "目标已保存"
      });
    } catch {
      this.setState({ message: "目标保存失败，请确认浏览器允许保存网站数据。" });
    }
  }

  renderVals() {
    return {
      navDate: Journal.selected(),
      ...this.state,
      hasWeight: Boolean(this.latest),
      noWeight: !this.latest,
      currentWeight: this.latest?.kg.toFixed(1),
      weightDate: this.latest ? Journal.shortDate(this.latest.date) + "记录" : "",
      savedTarget: this.goal.weight === null ? "" : (this.goal.weight / 10).toFixed(1),
      weighHref: Journal.link("Weigh", Journal.today),
      setHabit: (event) => this.setState({ habit: event.target.value, message: "" }),
      setTarget: (event) => this.setState({ target: event.target.value, message: "" }),
      save: (event) => this.save(event)
    };
  }
}
</script>
</body>
</html>
