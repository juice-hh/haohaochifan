<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5FC">
<meta name="apple-mobile-web-app-title" content="好好吃饭">
<link rel="manifest" href="./app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/app-180.png?v=20261123">
<link rel="stylesheet" href="./mobile.css?v=20261124-2">
<title>好好吃饭 我的目标</title>
<script src="./support.js?v=20261117-5"></script>
<script src="./journal.js?v=20261124-1"></script>
<script src="./navigation.js?v=20261121-2"></script>
<script src="./interactions.js?v=20261124-1"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#6F6A78;text-decoration:none}a:hover{color:#2A2633}
</style>
</helmet>
<div class="screen screen--tabs" style="background: #F7F5FC; color: #2A2633; font-family: -apple-system, system-ui, 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 12px">
  <header class="page-header">
    <h1 class="page-title">我的目标</h1>
  </header>
  <p class="page-header-note page-subtitle">好好吃饭，才能好好生活。</p>

  <section class="goal-card" aria-labelledby="diet-focus-heading">
    <h2 id="diet-focus-heading">饮食关注</h2>
    <div class="diet-focus-picker app-segmented" role="group" aria-label="饮食关注">
      <sc-for list="{{focusOptions}}" as="option">
        <button type="button" aria-pressed="{{option.selected}}" onClick="{{option.choose}}">{{option.label}}</button>
      </sc-for>
    </div>
    <p class="goal-note diet-focus-hint">{{focusHint}}</p>
    <sc-if value="{{focusMessage}}"><p class="goal-note" role="status">{{focusMessage}}</p></sc-if>
  </section>

  <section class="goal-card">
    <h2>最近一次体重</h2>
    <sc-if value="{{hasWeight}}">
      <p class="goal-current">{{currentWeight}} <small>kg</small></p>
      <span class="goal-note">{{weightDate}}</span>
    </sc-if>
    <sc-if value="{{noWeight}}">
      <p class="goal-note">还没有体重记录。你也可以只设生活习惯目标。</p>
    </sc-if>
    <a class="plan-action" href="{{weighHref}}">{{weighLabel}}</a>
    <sc-if value="{{savedTarget}}"><p class="goal-note">你的目标体重 {{savedTarget}} kg</p></sc-if>
  </section>

  <form class="goal-card" onSubmit="{{save}}">
    <h2>设个自己的目标</h2>
    <label class="goal-field">
      <span>想养成的习惯</span>
      <input onKeyDown="{{nextField}}" enterkeyhint="next" type="text" maxlength="80" placeholder="比如每周给自己做三顿饭" value="{{habit}}" onInput="{{setHabit}}">
    </label>
    <label class="goal-field">
      <span>目标体重（kg，选填）</span>
      <input id="goal-weight" enterkeyhint="done" type="text" inputmode="decimal" maxlength="7" placeholder="填写你自己的目标" value="{{target}}" onInput="{{setTarget}}">
    </label>
    <button type="submit" class="plan-action goal-save">{{saveLabel}}</button>
    <p class="goal-note" role="status">{{message}}</p>
  </form>
  <journal-nav page="Goal" date="{{navDate}}"></journal-nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.latest = Journal.latestWeight();
    this.goal = Journal.readGoal();
    this.state = {
      habit: this.goal.habit,
      target: this.goal.weight === null ? "" : Journal.formatWeight(this.goal.weight),
      message: "",
      dietFocus: Journal.readDietFocus(),
      focusMessage: ""
    };
    JournalUI.guardNavigation(() => this.state.habit.trim() !== this.goal.habit || (this.state.target.trim() ? Journal.parseWeight(this.state.target) === null || Journal.parseWeight(this.state.target) !== this.goal.weight : this.goal.weight !== null));
  }

  chooseFocus(focus) {
    if (this.state.dietFocus.id === focus.id) return;
    try {
      Journal.saveDietFocus(focus.id);
      this.setState({ dietFocus: focus, focusMessage: "已更新，记餐时生效。" });
    } catch {
      this.setState({ focusMessage: "饮食关注没有保存，请检查浏览器是否允许保存网站数据。" });
    }
  }

  save(event) {
    event.preventDefault();
    const target = this.state.target.trim();
    const weight = target ? Journal.parseWeight(target) : null;
    if (target && weight === null) {
      this.setState({ message: "请输入 0.1 到 500 公斤之间的体重。" });
      JournalUI.focusField("#goal-weight");
      return;
    }
    const goal = { habit: this.state.habit.trim(), weight };
    try {
      Journal.saveGoal(goal);
      this.goal = goal;
      document.activeElement?.blur?.();
      this.setState({
        habit: goal.habit,
        target: weight === null ? "" : Journal.formatWeight(weight),
        message: "目标已保存"
      });
    } catch {
      this.setState({ message: "目标保存失败，请确认浏览器允许保存网站数据。" });
    }
  }

  renderVals() {
    return {
      navDate: Journal.selected(),
      ...this.state,
      focusOptions: Journal.dietFocuses.map((focus) => ({
        label: focus.label,
        selected: focus.id === this.state.dietFocus.id,
        choose: () => this.chooseFocus(focus)
      })),
      focusHint: this.state.dietFocus.hint,
      hasWeight: Boolean(this.latest),
      noWeight: !this.latest,
      currentWeight: this.latest ? Journal.formatWeight(this.latest.weight) : "",
      weightDate: this.latest ? Journal.shortDate(this.latest.date) + "记录" : "",
      savedTarget: this.goal.weight === null ? "" : Journal.formatWeight(this.goal.weight),
      weighHref: Journal.link("Weigh", Journal.today, { returnTo: "Goal" }),
      weighLabel: this.latest ? "更新体重" : "记一笔体重",
      nextField: (event) => { if (event.key === "Enter") { event.preventDefault(); document.getElementById("goal-weight").focus(); } },
      saveLabel: this.state.message === "目标已保存" ? "已保存" : "保存目标",
      setHabit: (event) => this.setState({ habit: event.target.value, message: "" }),
      setTarget: (event) => this.setState({ target: event.target.value, message: "" }),
      save: (event) => this.save(event)
    };
  }
}
</script>
</body>
</html>
