<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2EF">
<meta name="apple-mobile-web-app-title" content="好好吃饭">
<link rel="manifest" href="./app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/app-180.png?v=20261123">
<link rel="stylesheet" href="./mobile.css?v=20261127-23">
<title>好好吃饭 饭相册</title>
<script src="./support.js?v=20261125"></script>
<script src="./journal.js?v=20261127-5"></script>
<script src="./interactions.js?v=20261125"></script>
<script src="./app-icons.js?v=20261127-1"></script>
<script src="./nutrition-visual.js?v=20261127-1"></script>
<script src="./food-stickers.js?v=20261127-1"></script>
<script src="./navigation.js?v=20261127-1"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2A2633;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div class="screen screen--tabs" style="background: #F3F2EF; color: #2A2633; font-family: -apple-system, system-ui, 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 12px">
  <header class="page-header">
    <h1 class="page-title">饭相册</h1>
    <p class="page-header-note">{{monthCount}}</p>
  </header>

  <div class="album-view-switch app-segmented" role="group" aria-label="饭相册视图">
    <sc-for list="{{views}}" as="v" hint-placeholder-count="2">
      <button type="button" aria-pressed="{{v.selected}}" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{isCal}}" hint-placeholder-val="{{true}}">
    <div style="background: #FFFFFF; border-radius: 32px; padding: 16px 12px 14px; box-shadow: 0 10px 30px rgba(90, 70, 160, 0.06); display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px">
        <button class="app-step-button" aria-label="上个月" onClick="{{previousMonth}}" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #F3F2EF; color: #6F6A78; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <span style="font-size: 18px; font-weight: 900">{{monthLabel}}</span>
        <button class="app-step-button" aria-label="下个月" onClick="{{nextMonth}}" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #F3F2EF; color: #6F6A78; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
      <div class="calendar-plan-toolbar">
        <span>{{calendarHint}}</span>
        <sc-if value="{{planning}}"><button type="button" class="plan-action" data-active="true" onClick="{{switchPlanning}}">完成</button></sc-if>
      </div>
      <sc-if value="{{planning}}">
        <div class="plan-picker" role="group" aria-label="计划贴纸">
          <sc-for list="{{stickers}}" as="s">
            <button type="button" class="plan-chip" aria-pressed="{{s.active}}" onClick="{{s.pick}}">
              <span class="plan-icon" data-plan="{{s.id}}" aria-hidden="true"></span> {{s.label}}
            </button>
          </sc-for>
        </div>
      </sc-if>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 700; color: #6F6A78">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <div class="calendar-cell" data-selected="{{c.selected}}">
            <sc-if value="{{c.date}}">
              <div class="calendar-cell-face" aria-hidden="true">
                <div class="calendar-food-stack">
                  <sc-for list="{{c.tiles}}" as="t" hint-placeholder-count="2">
                    <div style="{{t.style}}"></div>
                  </sc-for>
                </div>
                <span style="{{c.numStyle}}">{{c.day}}</span>
                <span style="{{c.dotStyle}}"></span>
                <sc-if value="{{showCalendarPlans}}">
                  <span class="plan-markers">
                    <sc-for list="{{c.plans}}" as="p"><span class="plan-icon" data-plan="{{p.id}}"></span></sc-for>
                  </span>
                </sc-if>
              </div>
              <sc-if value="{{planning}}">
                <button type="button" class="calendar-cell-target" aria-label="{{c.planAria}}" aria-pressed="{{c.marked}}" onClick="{{c.toggle}}"></button>
              </sc-if>
              <sc-if value="{{c.href}}">
                <a class="calendar-cell-target" href="{{c.href}}" aria-label="{{c.aria}}"></a>
              </sc-if>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: center; gap: 14px; font-size: 12px; font-weight: 700; color: #6F6A78; padding-top: 4px">有 {{loggedDays}} 天留下了饭记</div>
    </div>
    <p class="calendar-plan-status" role="status">{{planStatus}}</p>
  </sc-if>

  <sc-if value="{{isFood}}" hint-placeholder-val="{{false}}">
    <div class="album-filters" aria-label="食物分类">
      <div class="app-segmented" role="group" aria-label="分类方式">
        <sc-for list="{{foodFilterModes}}" as="mode"><button type="button" aria-pressed="{{mode.active}}" onClick="{{mode.pick}}">{{mode.label}}</button></sc-for>
      </div>
      <sc-if value="{{filterOptions.length}}">
        <div class="album-filter-options" role="group" aria-label="筛选食物">
          <sc-for list="{{filterOptions}}" as="option"><button type="button" aria-pressed="{{option.active}}" onClick="{{option.pick}}"><sc-if value="{{option.icon}}"><hh-icon name="{{option.icon}}" size="16"></hh-icon></sc-if>{{option.label}}</button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{filterNote}}"><p>{{filterNote}}</p></sc-if>
    </div>
    <sc-if value="{{foodEmpty}}"><p class="goal-note">当前分类没有记录。</p></sc-if>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{foods}}" as="f" hint-placeholder-count="6">
        <a href="{{f.href}}" style="background: #FFFFFF; border-radius: 28px; padding: 14px 14px 12px; box-shadow: 0 10px 30px rgba(90, 70, 160, 0.06); display: flex; flex-direction: column; gap: 6px">
          <div style="position: relative; height: 92px">
            <sc-for list="{{f.layers}}" as="l" hint-placeholder-count="3">
              <div style="{{l.style}}">{{l.label}}</div>
            </sc-for>
          </div>
          <div style="display: flex; align-items: baseline; justify-content: space-between">
            <span style="font-size: 15px; font-weight: 900">{{f.name}}</span>
            <span style="font-size: 13px; font-weight: 900; color: #5B48B8">×{{f.count}}</span>
          </div>
          <span style="font-size: 12px; font-weight: 600; color: #6F6A78">{{f.meta}}</span>
        </a>
      </sc-for>
    </div>
  </sc-if>
  <journal-nav page="Album" date="{{navDate}}"></journal-nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.date = Journal.selected(Journal.today);
    this.state = {
      view: Journal.params.get("view") === "food" ? "food" : "cal",
      month: Journal.monthStart(this.date),
      planning: Journal.params.get("plan") === "1",
      sticker: Journal.planStickers[0].id,
      planStatus: "", foodFilter: "all", foodCategory: "all"
    };
  }

  moveMonth(direction) {
    this.setState({ month: Journal.addMonths(this.state.month, direction), planStatus: "" });
  }

  switchPlanning() {
    const planning = !this.state.planning;
    const url = new URL(location.href);
    if (planning) url.searchParams.set("plan", "1");
    else url.searchParams.delete("plan");
    history.replaceState(null, "", url);
    this.setState({ planning, planStatus: "" });
  }

  toggleSticker(date, sticker) {
    try {
      const added = Journal.togglePlan(date, sticker.id);
      this.setState({
        planStatus: Journal.shortDate(date) + (added ? "已贴上「" : "已移除「") + sticker.label + "」"
      });
    } catch {
      this.setState({ planStatus: "计划保存失败，请确认浏览器允许保存网站数据后再试。" });
    }
  }

  renderVals() {
    var self = this;
    var tints = ['#FFEADB', '#FDE6F0', '#FFF4C9', '#E3F6E2', '#E1EEFF', '#EEE9FF'];
    var views = [{ id: 'cal', label: '日历' }, { id: 'food', label: '按食物' }].map(function (v) {
      var on = self.state.view === v.id;
      return {
        label: v.label, selected: on,
        pick: function () { self.setState({ view: v.id }); },
        style: 'height: 36px; border: none; border-radius: 999px; padding: 0 16px; font-size: 14px; font-family: inherit; font-weight: 800; background: ' + (on ? '#7A66E0' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#6F6A78')
      };
    });

    const { month, planning } = this.state;
    const sticker = Journal.planStickers.find(({ id }) => id === this.state.sticker);
    const stickers = Journal.planStickers.map((item) => ({
      ...item,
      active: item.id === sticker.id,
      pick: () => this.setState({ sticker: item.id, planStatus: "" })
    }));
    const next = Journal.addMonths(month, 1);
    const days = [];
    for (let date = month; date < next; date = Journal.addDays(date, 1)) {
      days.push(Journal.day(date));
    }
    const cells = Array.from({ length: (Journal.weekday(month) + 6) % 7 }, () => ({}));
    const groups = new Map();
    for (const [i, entry] of days.entries()) {
      const n = entry.meals.length;
      for (const meal of entry.meals) {
        const servings = FoodStickers.normalize(meal.foods);
        const [carb, pro, fat] = Journal.mealMacros(meal);
        const items = servings.length ? servings : [{ name: meal.name, nutrients: {carb, pro, fat} }];
        for (const item of items) {
          const name = item.name.replace(/(?:[（(]?(?:\d+(?:\.\d+)?|[一二两三四五六七八九十]+)\s*(?:克|碗|个|只|盒|份|杯|盘|瓶|片|块|颗|根)[）)]?)$/u, "").replace(/^[一二两三四五六七八九十]+(?:碗|个|只|盒|份|杯|盘|瓶|片|块|颗|根)/u, "").trim() || item.name;
          const group = groups.get(name) ?? { name, count: 0, c: groups.size, nutrients: new Set(), types: new Set() };
          group.count++;
          group.date = entry.date;
          const photo = Journal.photoFor(meal);
          if (photo) group.photo = photo;
          group.editHref = Journal.link("Day", entry.date, {from: "album"});
          const energy = ["carb", "pro", "fat"].map((key, j) => Number(item.nutrients?.[key] ?? 0) * [4, 4, 9][j]);
          const maximum = Math.max(...energy);
          if (maximum > 0) energy.forEach((amount, j) => { if (maximum === amount) group.nutrients.add(["碳水", "蛋白质", "脂肪"][j]); });
          const ingredients = name.match(/土豆|马铃薯|青椒|彩椒|玉米|红薯|紫薯|鸡腿|鸡肉|鸡蛋|蒸蛋|牛肉|猪肉|鱼|虾|豆腐|豆浆|牛奶|奶酪|米饭|稀饭|面条|面包|卷心菜|白菜|番茄|西红柿|黄瓜|胡萝卜|番薯|西兰花|生菜|菠菜|芹菜|茄子|芸豆|苹果|香蕉|橙子|猕猴桃|橘子|莓|水果|沙拉/gu) ?? [];
          for (const ingredient of ingredients) group.types.add(({马铃薯:"土豆", 彩椒:"青椒", 紫薯:"红薯", 蒸蛋:"鸡蛋", 西红柿:"番茄", 鸡腿:"鸡肉"})[ingredient] ?? ingredient);
          if (!ingredients.length) group.types.add(name);
          if (/青椒|彩椒|卷心菜|白菜|番茄|西红柿|黄瓜|胡萝卜|西兰花|生菜|菠菜|芹菜|茄子|苹果|香蕉|橙子|猕猴桃|橘子|莓|水果/u.test(name)) group.nutrients.add("维生素");
          groups.set(name, group);
        }
      }
      const tiles = entry.meals.slice(-3).map((meal, j) => {
        const photo = Journal.photoFor(meal);
        return {
          style: 'position: absolute; left: ' + (5 + [0, 3, -2][j]) + 'px; top: ' + (8 - j * 4)
            + 'px; width: 24px; height: 24px; box-sizing: border-box; border-radius: 8px; border: 2px solid #FFFFFF; background: '
            + (photo ? 'center / cover url("' + photo + '")' : tints[(i + j * 2) % tints.length])
            + '; transform: rotate(' + [-6, 5, -2][(i + j) % 3] + 'deg); box-shadow: 0 2px 5px rgba(90, 70, 160, 0.14)'
        };
      });
      const { date } = entry;
      const plans = Journal.plansOn(date);
      const label = Journal.shortDate(date);
      const planNames = plans.map(({ label }) => label).join("、");
      cells.push({
        date, day: i + 1, tiles, plans,
        selected: date === this.date,
        marked: plans.some(({ id }) => id === sticker.id),
        toggle: () => this.toggleSticker(date, sticker),
        href: planning ? "" : Journal.link("Day", date, { from: "album" }),
        aria: label + "，" + (n ? n + " 餐" : "没记录") + (planNames ? "，计划：" + planNames : ""),
        planAria: label + "，" + sticker.label,
        numStyle: 'font-size: 11px; font-weight: 800; color: ' + (n ? '#2A2633' : '#807A8D'),
        dotStyle: 'width: 5px; height: 5px; border-radius: 3px; background: ' + (n ? '#A996F2' : 'transparent')
      });
    }
    const {foodFilter, foodCategory} = this.state;
    const foodFilterModes = [["all", "全部"], ["nutrition", "按营养素"], ["type", "按食物种类"]].map(([id, label]) => ({
      label, active: foodFilter === id, pick: () => this.setState({foodFilter: id, foodCategory: "all"})
    }));
    const categories = foodFilter === "nutrition" ? ["碳水", "蛋白质", "维生素", "脂肪"]
      : foodFilter === "type" ? [...new Set([...groups.values()].flatMap(group => [...group.types]))].sort((a,b) => a.localeCompare(b, "zh-CN"))
      : [];
    const filterOptions = categories.length ? ["all", ...categories].map(key => ({
      label: key === "all" ? "全部食物" : key, icon: { 碳水: "carb", 蛋白质: "pro", 维生素: "fiber", 脂肪: "fat" }[key] ?? "",
      active: foodCategory === key, pick: () => this.setState({foodCategory: key})
    })) : [];
    const list = [...groups.values()].filter(group => foodCategory === "all" || (foodFilter === "nutrition" ? group.nutrients : group.types).has(foodCategory))
      .sort((a, b) => b.count - a.count || b.date.localeCompare(a.date));
    var foods = list.map(function (f) {
      var k = Math.min(f.count, 4);
      var layers = [];
      for (var j = 0; j < k; j++) {
        var top = j === k - 1;
        layers.push({
          label: top && !f.photo ? f.name : '',
          style: 'position: absolute; left: ' + (22 + [0, 6, -5, 3][j]) + 'px; top: ' + (14 - j * 4) + 'px; width: 92px; height: 72px; box-sizing: border-box; border-radius: 22px; border: 4px solid #FFFFFF; background: ' + (top && f.photo ? 'center / cover url("' + f.photo + '")' : tints[(f.c + j) % tints.length]) + '; transform: rotate(' + [-8, 6, -3, 2][j] + 'deg); box-shadow: 0 5px 12px rgba(90, 70, 160, 0.13); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #5A4E44'
        });
      }
      return {
        name: f.name, count: f.count, layers,
        href: f.editHref,
        meta: "最近记录于" + Journal.shortDate(f.date)
      };
    });

    const monthNumber = Number(month.slice(5, 7));
    const count = days.reduce((sum, day) => sum + day.meals.length, 0);
    return {
      navDate: this.date,
      views, cells, foods, planning, stickers, foodFilterModes, filterOptions,
      foodEmpty: !foods.length,
      filterNote: foodFilter === "nutrition" ? "按已记录的主要供能营养素分类；维生素按名称中可辨识的蔬果归类。" : "",
      showCalendarPlans: planning || cells.some((cell) => cell.plans?.length),
      calendarHint: planning ? "点日期贴上，再点一次取消" : "点日期查看饭记",
      planStatus: this.state.planStatus,
      switchPlanning: () => this.switchPlanning(),
      isCal: this.state.view === "cal", isFood: this.state.view === "food",
      monthLabel: month.slice(0, 4) + " 年 " + monthNumber + " 月",
      monthCount: monthNumber + " 月记了 " + count + " 餐",
      loggedDays: days.filter((day) => day.meals.length).length,
      emptyMonth: count === 0,
      backHref: Journal.link("Main", this.date),
      previousMonth: () => this.moveMonth(-1),
      nextMonth: () => this.moveMonth(1)
    };
  }
}
</script>
</body>
</html>
