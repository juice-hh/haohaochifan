<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2EF">
<link rel="stylesheet" href="./mobile.css?v=20261127-27">
<title>好好吃饭 设置</title>
<script src="./support.js?v=20261125"></script>
<script src="./journal.js?v=20261127-5"></script>
<script src="./app-icons.js?v=20261127-1"></script>
</head>
<body style="margin:0">
<x-dc>
<main class="screen screen--flow settings-screen">
  <header class="app-toolbar">
    <a class="app-icon-button" href="{{backHref}}" aria-label="返回">‹</a>
    <h1 class="page-title">设置</h1>
  </header>
  <section class="goal-card">
    <h2>记录册</h2>
    <sc-for list="{{toggles}}" as="t">
      <div class="settings-toggle">
        <span class="settings-toggle-icon" aria-hidden="true"><hh-icon name="{{t.icon}}" size="22"></hh-icon></span>
        <span class="settings-toggle-text"><strong id="{{t.id}}">{{t.label}}</strong><small>{{t.detail}}</small></span>
        <button type="button" class="app-switch" role="switch" aria-checked="{{t.on}}" aria-labelledby="{{t.id}}" onClick="{{t.toggle}}"></button>
      </div>
    </sc-for>
    <sc-if value="{{periodOn}}"><a class="settings-link-row" href="{{periodHref}}"><span>经期记录和复盘</span><hh-icon name="right" size="16"></hh-icon></a></sc-if>
    <p class="goal-note">经期记录只保存在这台手机上，不会上传，识别饭菜时也不会带上。</p>
  </section>
  <section class="goal-card">
    <h2>照片识别</h2>
    <div class="app-segmented" role="group" aria-label="记录方式">
      <button type="button" aria-pressed="{{auto}}" onClick="{{enable}}">AI 辅助</button>
      <button type="button" aria-pressed="{{manual}}" onClick="{{disable}}">手动记录</button>
    </div>
    <p class="goal-note">{{modeHint}}</p>
  </section>
  <section class="goal-card">
    <h2>饮食关注</h2>
    <div class="settings-focus" role="group" aria-label="饮食关注">
      <sc-for list="{{focuses}}" as="focus">
        <button type="button" aria-pressed="{{focus.active}}" onClick="{{focus.choose}}">
          <span class="settings-focus-mark" data-focus="{{focus.id}}" aria-hidden="true"><hh-icon name="{{focus.icon}}" size="24"></hh-icon></span>
          <span><strong>{{focus.label}}</strong><small>{{focus.detail}}</small></span>
        </button>
      </sc-for>
    </div>
  </section>
  <p class="goal-note" role="status">{{status}}</p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let auto = true;
    try { auto = localStorage.getItem("hhcf-record-mode") !== "manual"; } catch {}
    this.state = { auto, focus: Journal.readDietFocus().id, status: "", period: Journal.periodEnabled(), prompts: Journal.readPrompts() };
  }

  save(update, values) {
    try {
      update();
      this.setState({ ...values, status: "设置已保存" });
    } catch {
      this.setState({ status: "暂时无法保存设置，请检查浏览器存储。" });
    }
  }

  renderVals() {
    const { auto, focus, status } = this.state;
    const page = ["Goal", "Day"].includes(Journal.params.get("returnTo")) ? Journal.params.get("returnTo") : "Main";
    const setMode = (enabled) => this.save(() => localStorage.setItem("hhcf-record-mode", enabled ? "ai" : "manual"), {auto: enabled});
    const { period, prompts } = this.state;
    const toggles = [
      { id: "toggle-period", icon: "period", label: "记录经期", detail: "很多人经期会更想吃东西，记下来能看出规律。随时可以关掉。", on: String(period),
        toggle: () => this.save(() => Journal.setPeriodEnabled(!period), { period: !period }) },
      { id: "toggle-walk", icon: "walk", label: "饭后走走提醒", detail: "午饭和晚饭后在当天饭记里问一句，点一下就记好。", on: String(prompts.walk),
        toggle: () => { const next = { ...prompts, walk: !prompts.walk }; this.save(() => Journal.savePrompts(next), { prompts: next }); } },
      { id: "toggle-afternoon", icon: "sleepy", label: "下午状态", detail: "下午 3 点后问一句困不困，看看吃什么让下午更清醒。", on: String(prompts.afternoon),
        toggle: () => { const next = { ...prompts, afternoon: !prompts.afternoon }; this.save(() => Journal.savePrompts(next), { prompts: next }); } }
    ];
    return {
      toggles, periodOn: period, periodHref: Journal.link("Period", Journal.selected(), { returnTo: "Settings" }),
      auto, manual: !auto, status, backHref: Journal.link(page, Journal.selected()),
      enable: () => setMode(true), disable: () => setMode(false),
      modeHint: auto ? "拍照或选图后会发送给 OpenAI 估算营养。" : "照片保存在当前设备。需要时可在编辑页开启单次识别。",
      focuses: Journal.dietFocuses.map((item, index) => ({
        ...item, icon: ["energy", "sugar", "fiber"][index], active: item.id === focus,
        detail: item.fields.length ? item.fields.map(key => Journal.focusNutrients[key]).join("、") : "热量、碳水、蛋白质和脂肪",
        choose: () => this.save(() => Journal.saveDietFocus(item.id), {focus: item.id})
      }))
    };
  }
}
</script>
</body>
</html>
